<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- The colour theme, set before first paint. A file, not an inline script: the Windows app and the Docker web container refuse inline scripts. -->
    <script src="/theme-init.js"></script>

    <!-- Fonts are self-hosted (public/fonts, declared in src/index.css), never loaded from a font service:
         the Windows app and the Docker web container allow fonts only from the page's own origin. -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Plan your degree. Track courses, prerequisites, and projected graduation.">
    <title>MyDegreePlan</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
